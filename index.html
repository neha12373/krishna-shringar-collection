<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Catalogue</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================
   BODY
========================= */

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f5;
    color: #222;
}


/* =========================
   HEADER
========================= */

.header {

    height: 110px;

    background: #fff;

    display: flex;

    align-items: center;

    padding: 0 32px;

    gap: 30px;

    border-bottom: 1px solid #eee;
}


.logo {

    font-family: Georgia, serif;

    font-size: 34px;

    font-weight: 600;

    white-space: nowrap;
}


.search-box {

    margin-left: auto;

    width: 265px;

    height: 64px;

    border: 1px solid #ddd;

    border-radius: 16px;

    background: #f8f7f4;

    display: flex;

    align-items: center;

    padding: 0 20px;

    gap: 15px;
}


.search-icon {

    font-size: 27px;

    color: #777;
}


.search-box input {

    border: none;

    outline: none;

    background: transparent;

    width: 100%;

    font-size: 18px;
}


.item-count {

    font-size: 18px;

    color: #777;

    white-space: nowrap;
}


/* =========================
   CATEGORIES
========================= */

.categories {

    height: 90px;

    background: #fff;

    display: flex;

    align-items: center;

    gap: 55px;

    padding: 0 65px;

    border-bottom: 1px solid #ddd;

    overflow-x: auto;
}


.category {

    height: 90px;

    display: flex;

    align-items: center;

    position: relative;

    font-size: 21px;

    color: #555;

    white-space: nowrap;

    cursor: pointer;
}


.category.active {

    color: #b79b62;
}


.category.active::after {

    content: "";

    position: absolute;

    bottom: 0;

    left: -35px;

    right: -35px;

    height: 4px;

    background: #b79b62;
}


/* =========================
   SORT
========================= */

.sort-section {

    height: 105px;

    display: flex;

    align-items: center;

    gap: 20px;

    padding: 0 32px;

    overflow-x: auto;
}


.sort-title {

    font-size: 18px;

    color: #777;

    letter-spacing: 1px;

    margin-right: 5px;

    white-space: nowrap;
}


.sort-btn {

    border: none;

    padding: 15px 27px;

    border-radius: 30px;

    background: #fff;

    font-size: 18px;

    color: #555;

    cursor: pointer;

    white-space: nowrap;
}


.sort-btn.active {

    background: #d2b16e;

    color: #fff;
}


/* =========================
   CATALOGUE
========================= */

.catalogue {

    padding: 0 32px 50px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 28px;
}


.product-card {

    background: #fff;

    border-radius: 25px;

    overflow: hidden;

    border: 1px solid #e8e8e8;

    transition:
        transform .2s,
        box-shadow .2s;
}


.product-card:hover {

    transform: translateY(-3px);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.08);
}


/* =========================
   IMAGE
========================= */

.product-image {

    width: 100%;

    aspect-ratio: 1.15 / 1;

    background: #eee;

    overflow: hidden;
}


.product-image img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


.product-image a {

    display: block;

    width: 100%;

    height: 100%;
}


/* =========================
   PRODUCT INFO
========================= */

.product-info {

    padding:
        25px
        28px
        30px;
}


.product-code {

    color: #c1a15e;

    font-size: 18px;

    font-weight: 600;

    margin-bottom: 10px;
}


.product-name {

    font-size: 25px;

    margin-bottom: 15px;
}


.product-date {

    color: #888;

    font-size: 18px;
}


/* =========================
   NO RESULTS
========================= */

.no-results {

    grid-column: 1 / -1;

    text-align: center;

    padding: 80px 20px;

    color: #888;

    font-size: 20px;
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 900px) {

    .catalogue {

        grid-template-columns:
            repeat(3, 1fr);
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .header {

        height: 85px;

<script>


/* ==================================================
   ELEMENTS
================================================== */

const catalogue =
    document.getElementById("catalogue");


const searchInput =
    document.getElementById("searchInput");


const itemCount =
    document.getElementById("itemCount");


const categories =
    document.querySelectorAll(".category");


const sortButtons =
    document.querySelectorAll(".sort-btn");


/* ==================================================
   ORIGINAL PRODUCT CARDS
================================================== */

const cards = [
    ...document.querySelectorAll(".product-card")
];


/* ==================================================
   CURRENT SETTINGS
================================================== */

let selectedCategory = "all";

let selectedSort = "newest";


/* ==================================================
   CATEGORY DISPLAY NAMES
================================================== */

const categoryNames = {

    "khilone": "Khilone",

    "mukut set": "Mukut Set",

    "nath": "Nath",

    "jardogi mukut": "Jardogi Mukut",

    "ramadarbar": "Ramadarbar",

    "kamarband": "Kamarband",

    "bali": "Bali",

    "poshak": "Poshak",

    "payal": "Payal",

    "mala": "Mala",

    "jhula": "Jhula",

    "bansi": "Bansi",

    "baal": "Baal",

    "kada": "Kadha"

};


/* ==================================================
   GET CATEGORY NAME
================================================== */

function getCategoryName(category) {

    return categoryNames[category] || category;

}


/* ==================================================
   CREATE AUTOMATIC DN NUMBER
================================================== */

function getDNNumber(number) {

    /*
       Poshak 1 = DN-1001
       Poshak 2 = DN-1002
       Poshak 3 = DN-1003

       etc.
    */

    return `DN-${1000 + number}`;

}


/* ==================================================
   FORMAT DATE
================================================== */

function formatDate(dateString) {

    const date =
        new Date(
            dateString + "T00:00:00"
        );


    return date.toLocaleDateString(
        "en-GB",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* ==================================================
   MAKE PRODUCT CARD
================================================== */

function updateCard(
    card,
    number
) {

    const category =
        card.dataset.category;


    const image =
        card.dataset.image;


    const date =
        card.dataset.date;


    const categoryName =
        getCategoryName(category);


    /*
       IMPORTANT:

       Search ke liye original
       product name bhi save kar rahe hain.
    */

    card.dataset.searchName =
        categoryName.toLowerCase();


    /*
       Automatic product name
    */

    const productName =
        `${categoryName} ${number}`;


    /*
       Automatic DN
    */

    const productCode =
        getDNNumber(number);


    /*
       Card HTML
    */

    card.innerHTML = `

        <div class="product-image">

            <a
                href="${image}"
                target="_blank"
            >

                <img
                    src="${image}"
                    alt="${productName}"
                >

            </a>

        </div>


        <div class="product-info">

            <div class="product-code">

                ${productCode}

            </div>


            <div class="product-name">

                ${productName}

            </div>


            <div class="product-date">

                ${formatDate(date)}

            </div>

        </div>

    `;

}


/* ==================================================
   RENDER CATALOGUE
================================================== */

function renderCatalogue() {


    /*
       SEARCH VALUE
    */

    const search =
        searchInput.value
            .toLowerCase()
            .trim();


    /*
       ----------------------------------------------
       STEP 1
       CATEGORY FILTER
       ----------------------------------------------
    */

    let filtered =
        cards.filter(card => {

            const category =
                card.dataset.category
                    .toLowerCase();


            return (
                selectedCategory === "all" ||
                category === selectedCategory
            );

        });


    /*
       ----------------------------------------------
       STEP 2
       SEARCH FILTER
       ----------------------------------------------

       Search in:

       Category
       Image filename
       ----------------------------------------------
    */

    if (search !== "") {

        filtered =
            filtered.filter(card => {

                const category =
                    getCategoryName(
                        card.dataset.category
                    ).toLowerCase();


                const image =
                    card.dataset.image
                        .toLowerCase();


                return (
                    category.includes(search) ||
                    image.includes(search)
                );

            });

    }


    /*
       ----------------------------------------------
       STEP 3
       SORT
       ----------------------------------------------
    */


    if (selectedSort === "newest") {

        filtered.sort((a, b) => {

            const dateA =
                new Date(a.dataset.date);


            const dateB =
                new Date(b.dataset.date);


            return dateB - dateA;

        });

    }


    if (selectedSort === "oldest") {

        filtered.sort((a, b) => {

            const dateA =
                new Date(a.dataset.date);


            const dateB =
                new Date(b.dataset.date);


            return dateA - dateB;

        });

    }


    if (selectedSort === "az") {

        filtered.sort((a, b) => {

            const nameA =
                getCategoryName(
                    a.dataset.category
                );


            const nameB =
                getCategoryName(
                    b.dataset.category
                );


            return nameA.localeCompare(nameB);

        });

    }


    /*
       ----------------------------------------------
       STEP 4
       CATEGORY TOTALS
       ----------------------------------------------

       Example:

       Poshak = 7

       categoryTotals["poshak"] = 7
    */

    const categoryTotals = {};


    filtered.forEach(card => {

        const category =
            card.dataset.category;


        if (!categoryTotals[category]) {

            categoryTotals[category] = 0;

        }


        categoryTotals[category]++;

    });


    /*
       ----------------------------------------------
       STEP 5
       NUMBERING
       ----------------------------------------------
    */

    const counters = {};


    filtered.forEach(card => {

        const category =
            card.dataset.category;


        if (!counters[category]) {

            counters[category] = 0;

        }


        counters[category]++;


        let number;


        /*
           ==========================================
           NEWEST FIRST
           ==========================================

           Example:

           30 Aug = Poshak 1
           28 Aug = Poshak 2
           26 Aug = Poshak 3
           24 Aug = Poshak 4
        */

        if (selectedSort === "newest") {

            number =
                counters[category];

        }


        /*
           ==========================================
           OLDEST FIRST
           ==========================================

           Example:

           24 Aug = Poshak 4
           26 Aug = Poshak 3
           28 Aug = Poshak 2
           30 Aug = Poshak 1
        */

        else if (
            selectedSort === "oldest"
        ) {

            number =
                categoryTotals[category]
                -
                counters[category]
                +
                1;

        }


        /*
           ==========================================
           A → Z
           ==========================================
        */

        else {

            number =
                counters[category];

        }


        /*
           Card update
        */

        updateCard(
            card,
            number
        );

    });


    /*
       ----------------------------------------------
       STEP 6
       CLEAR CATALOGUE
       ----------------------------------------------
    */

    catalogue.innerHTML = "";


    /*
       ----------------------------------------------
       STEP 7
       SHOW PRODUCTS
       ----------------------------------------------
    */

    if (filtered.length === 0) {

        catalogue.innerHTML = `

            <div class="no-results">

                No items found

            </div>

        `;

    }


    else {

        filtered.forEach(card => {

            catalogue.appendChild(card);

        });

    }


    /*
       ----------------------------------------------
       STEP 8
       ITEM COUNT
       ----------------------------------------------
    */

    itemCount.textContent =
        `${filtered.length} items`;

}
